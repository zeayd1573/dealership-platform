# Deploys the Worker (API + site + admin) to Cloudflare on every push to main.
# Needs the CLOUDFLARE_API_TOKEN repo secret (Workers, D1 and R2 edit).
# Worker secrets (JWT_SECRET, ADMIN_*, REG_USERNAME) already live in Cloudflare and are not touched.
name: Deploy

on:
  push:
    branches: [main]
    paths: ['api/**', 'site/**', 'admin/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: node scripts/build-assets.js
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply dealer-platform --remote
      - name: Deploy
        run: npx wrangler deploy
