# Generate the Xcode project with:  brew install xcodegen && xcodegen generate
name: XtreamPlayer
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  XtreamPlayer:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [Sources]
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Xtream Player
        LSApplicationCategoryType: public.app-category.entertainment
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # IPTV panels are almost always plain http, so ATS must allow it.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.xtreamplayer
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Config/Mac.entitlements
        GENERATE_INFOPLIST_FILE: NO
